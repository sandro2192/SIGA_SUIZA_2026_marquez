name: siga_suiza_2026

# ============================================================
# Variables comunes de base de datos para todos los servicios.
# Se leen desde el .env de la raiz (Docker Compose).
# ============================================================
x-db-env: &db-env
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-admin}
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-siga_suiza_2026}
  NATS_URL: nats://nats:4222

# Healthcheck estándar de los microservicios (usa la variable PORT).
x-module-healthcheck: &module-healthcheck
  test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 45s

# Base compartida por Core y microservicios.
x-backend-base: &backend-base
  build:
    context: ./siga_backend
    dockerfile: Dockerfile
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./siga_backend:/app
  healthcheck: *module-healthcheck
  restart: unless-stopped

services:
  # Base de datos: la aplicación usa el PostgreSQL local del host (pgAdmin)
  # en el puerto 5432, accesible desde los contenedores vía host.docker.internal.
  # Credenciales en .env (DB_PASSWORD=admin).

  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ====== PGADMIN (interfaz web para la BD local) ======
  # http://localhost:5050  |  admin@siga.edu / admin
  # Servidor "SIGA - PostgreSQL local" ya precargado (password: admin).
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@siga.edu}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=True
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      siga-core:
        condition: service_healthy
    restart: unless-stopped

  # ====== CORE GATEWAY ======
  siga-core:
    <<: *backend-base
    ports:
      - "8000:8000"
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
      mod-usuarios:
        condition: service_healthy
      mod-planes-estudio:
        condition: service_healthy
      mod-programas-estudio:
        condition: service_healthy
      mod-gestion-academica:
        condition: service_healthy
      mod-auditoria:
        condition: service_healthy
      mod-evaluacion:
        condition: service_healthy
      mod-admision:
        condition: service_healthy

  # ====== MICROSERVICES ======
  mod-usuarios:
    <<: *backend-base
    command: ["sh", "-c", "cd modules/mod-usuarios && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"]
    ports:
      - "8001:8001"
    environment:
      <<: *db-env
      PORT: 8001
      SKIP_MIGRATIONS: "true"

  mod-planes-estudio:
    <<: *backend-base
    command: ["sh", "-c", "cd modules/mod-planes-estudio && uvicorn main:app --host 0.0.0.0 --port 8002 --reload"]
    ports:
      - "8002:8002"
    environment:
      <<: *db-env
      PORT: 8002
      SKIP_MIGRATIONS: "true"

  mod-programas-estudio:
    <<: *backend-base
    command: ["sh", "-c", "cd modules/mod-programas-estudio && uvicorn main:app --host 0.0.0.0 --port 8005 --reload"]
    ports:
      - "8005:8005"
    environment:
      <<: *db-env
      PORT: 8005
      SKIP_MIGRATIONS: "true"

  mod-gestion-academica:
    <<: *backend-base
    command: ["sh", "-c", "cd modules/mod-gestion-academica && uvicorn main:app --host 0.0.0.0 --port 8006 --reload"]
    ports:
      - "8006:8006"
    environment:
      <<: *db-env
      PORT: 8006
      SKIP_MIGRATIONS: "true"

  mod-auditoria:
    <<: *backend-base
    command: ["sh", "-c", "cd modules/mod-auditoria && uvicorn main:app --host 0.0.0.0 --port 8007 --reload"]
    ports:
      - "8007:8007"
    environment:
      <<: *db-env
      PORT: 8007
      SKIP_MIGRATIONS: "true"

  mod-evaluacion:
    <<: *backend-base
    command: ["sh", "-c", "cd modules/mod-evaluacion && uvicorn main:app --host 0.0.0.0 --port 8008 --reload"]
    ports:
      - "8008:8008"
    environment:
      <<: *db-env
      PORT: 8008
      SKIP_MIGRATIONS: "true"

  mod-admision:
    <<: *backend-base
    command: ["sh", "-c", "cd modules/mod-admision && uvicorn main:app --host 0.0.0.0 --port 8009 --reload"]
    ports:
      - "8009:8009"
    environment:
      <<: *db-env
      PORT: 8009
      SKIP_MIGRATIONS: "true"
    volumes:
      - ./siga_backend:/app
      - ./docs:/app/docs

  # ====== FRONTEND ======
  siga-frontend:
    build:
      context: ./siga_frontend
      dockerfile: Dockerfile
      target: dev
    command: ["sh", "-c", "npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./siga_frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      siga-core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:
  pgadmin_data:
